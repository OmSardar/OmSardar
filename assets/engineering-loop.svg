<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 330" role="img" aria-labelledby="title desc">
  <style>
    .flow { stroke-dasharray: 6 8; animation: flow 1.8s linear infinite; }
    .f2 { animation-delay: .3s; } .f3 { animation-delay: .6s; }
    .f4 { animation-delay: .9s; } .f5 { animation-delay: 1.2s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .packet { animation: none; }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .packet { display: none; } }
  </style>
  <title id="title">Engineering learning loop</title>
  <desc id="desc">A practical cycle of learning, planning, building, testing, shipping, and reflecting.</desc>
  <rect x="1" y="1" width="1598" height="328" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="48" y="58" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">A practical engineering loop<animate attributeName="fill" values="#e6edf3;#58a6ff;#bc8cff;#e6edf3" dur="6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0" keyTimes="0;.18;1" dur="5s" begin="0s" repeatCount="indefinite"/></text>
  <text x="1552" y="56" text-anchor="end" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="16">A repeatable way to learn and improve</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(40 112)">
      <rect width="220" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect width="220" height="4" rx="2" fill="#58a6ff"/>
      <text x="20" y="32" fill="#58a6ff" font-size="14" font-weight="700">01</text>
      <text x="20" y="74" fill="#e6edf3" font-size="22" font-weight="700">Learn<animate attributeName="fill" values="#e6edf3;#58a6ff;#e6edf3" dur="5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0" keyTimes="0;.18;1" dur="5s" begin="0s" repeatCount="indefinite"/></text>
      <text x="20" y="105" fill="#8b949e" font-size="15">Understand the problem</text>
    </g>
    <path d="M268 178h26" fill="none" stroke="#58a6ff" stroke-width="2" class="flow"/>
    <path d="M286 170l8 8-8 8" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <circle class="packet" r="4" fill="#58a6ff"><animateMotion path="M268 178H294" dur="1s" repeatCount="indefinite"/></circle>
    <g transform="translate(300 112)">
      <rect width="220" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect width="220" height="4" rx="2" fill="#39c5cf"/>
      <text x="20" y="32" fill="#58a6ff" font-size="14" font-weight="700">02</text>
      <text x="20" y="74" fill="#e6edf3" font-size="22" font-weight="700">Plan<animate attributeName="fill" values="#e6edf3;#39c5cf;#e6edf3" dur="5s" begin=".7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0" keyTimes="0;.18;1" dur="5s" begin=".7s" repeatCount="indefinite"/></text>
      <text x="20" y="105" fill="#8b949e" font-size="15">Design before coding</text>
    </g>
    <path d="M528 178h26" fill="none" stroke="#39c5cf" stroke-width="2" class="flow f2"/>
    <path d="M546 170l8 8-8 8" fill="none" stroke="#39c5cf" stroke-width="2"/>
    <circle class="packet" r="4" fill="#39c5cf"><animateMotion path="M528 178H554" dur="1.2s" begin=".25s" repeatCount="indefinite"/></circle>
    <g transform="translate(560 112)">
      <rect width="220" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect width="220" height="4" rx="2" fill="#bc8cff"/>
      <text x="20" y="32" fill="#58a6ff" font-size="14" font-weight="700">03</text>
      <text x="20" y="74" fill="#e6edf3" font-size="22" font-weight="700">Build<animate attributeName="fill" values="#e6edf3;#bc8cff;#e6edf3" dur="5s" begin="1.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0" keyTimes="0;.18;1" dur="5s" begin="1.4s" repeatCount="indefinite"/></text>
      <text x="20" y="105" fill="#8b949e" font-size="15">Write clear, useful code</text>
    </g>
    <path d="M788 178h26" fill="none" stroke="#bc8cff" stroke-width="2" class="flow f3"/>
    <path d="M806 170l8 8-8 8" fill="none" stroke="#bc8cff" stroke-width="2"/>
    <circle class="packet" r="4" fill="#bc8cff"><animateMotion path="M788 178H814" dur="1.1s" begin=".5s" repeatCount="indefinite"/></circle>
    <g transform="translate(820 112)">
      <rect width="220" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect width="220" height="4" rx="2" fill="#3fb950"/>
      <text x="20" y="32" fill="#58a6ff" font-size="14" font-weight="700">04</text>
      <text x="20" y="74" fill="#e6edf3" font-size="22" font-weight="700">Test<animate attributeName="fill" values="#e6edf3;#3fb950;#e6edf3" dur="5s" begin="2.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0" keyTimes="0;.18;1" dur="5s" begin="2.1s" repeatCount="indefinite"/></text>
      <text x="20" y="105" fill="#8b949e" font-size="15">Check edge cases</text>
    </g>
    <path d="M1048 178h26" fill="none" stroke="#3fb950" stroke-width="2" class="flow f4"/>
    <path d="M1066 170l8 8-8 8" fill="none" stroke="#3fb950" stroke-width="2"/>
    <circle class="packet" r="4" fill="#3fb950"><animateMotion path="M1048 178H1074" dur="1.3s" begin=".75s" repeatCount="indefinite"/></circle>
    <g transform="translate(1080 112)">
      <rect width="220" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect width="220" height="4" rx="2" fill="#f0883e"/>
      <text x="20" y="32" fill="#58a6ff" font-size="14" font-weight="700">05</text>
      <text x="20" y="74" fill="#e6edf3" font-size="22" font-weight="700">Ship<animate attributeName="fill" values="#e6edf3;#f0883e;#e6edf3" dur="5s" begin="2.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0" keyTimes="0;.18;1" dur="5s" begin="2.8s" repeatCount="indefinite"/></text>
      <text x="20" y="105" fill="#8b949e" font-size="15">Deliver and observe</text>
    </g>
    <path d="M1308 178h26" fill="none" stroke="#f0883e" stroke-width="2" class="flow f5"/>
    <path d="M1326 170l8 8-8 8" fill="none" stroke="#f0883e" stroke-width="2"/>
    <circle class="packet" r="4" fill="#f0883e"><animateMotion path="M1308 178H1334" dur="1.2s" begin="1s" repeatCount="indefinite"/></circle>
    <g transform="translate(1340 112)">
      <rect width="220" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect width="220" height="4" rx="2" fill="#ff7b72"/>
      <text x="20" y="32" fill="#58a6ff" font-size="14" font-weight="700">06</text>
      <text x="20" y="74" fill="#e6edf3" font-size="22" font-weight="700">Reflect<animate attributeName="fill" values="#e6edf3;#ff7b72;#e6edf3" dur="5s" begin="3.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 8;0 0;0 0" keyTimes="0;.18;1" dur="5s" begin="3.5s" repeatCount="indefinite"/></text>
      <text x="20" y="105" fill="#8b949e" font-size="15">Measure and improve</text>
    </g>
  </g>
  <text x="800" y="291" text-anchor="middle" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="15">Learn from results, then begin the next iteration.</text>
</svg>
