<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 150" role="img" aria-labelledby="title desc">
  <style>.pulse{animation:pulse 3s ease-in-out infinite}.glint{animation:glint 6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes glint{0%,18%{transform:translateX(0);opacity:0}38%{opacity:.7}72%,100%{transform:translateX(1480px);opacity:0}}@media(prefers-reduced-motion:reduce){.pulse,.glint{animation:none}}</style>
  <defs><linearGradient id="movingGradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#58a6ff"/><stop offset=".24" stop-color="#39c5cf"/><stop offset=".5" stop-color="#bc8cff"/><stop offset=".76" stop-color="#ff7b9c"/><stop offset="1" stop-color="#58a6ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="16s" repeatCount="indefinite"/></linearGradient></defs>
  <title id="title">Get in touch</title><desc id="desc">Feel free to reach out for collaboration, opportunities, or a conversation about technology.</desc>
  <rect x="2" y="2" width="1596" height="146" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="3" y="3" width="1594" height="4" rx="2" fill="url(#movingGradient)" class="pulse"/><rect x="4" y="4" width="48" height="2" rx="1" fill="#fff" class="glint"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle"><circle cx="110" cy="76" r="25" fill="#1f6feb" opacity=".18" class="pulse"/><path d="M98 74h24v17h-24zM98 75l12 9 12-9" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linejoin="round"/><text x="800" y="70" fill="#f0f6fc" font-size="25" font-weight="700">Let’s connect</text><text x="800" y="108" fill="#8b949e" font-size="21">Reach out for collaboration, opportunities, or a conversation about technology.</text><circle cx="1490" cy="76" r="5" fill="#39c5cf" class="pulse"/><circle cx="1510" cy="76" r="5" fill="#bc8cff" class="pulse"/><circle cx="1530" cy="76" r="5" fill="#ff7b9c" class="pulse"/></g>
</svg>
