<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 330" role="img" aria-labelledby="title desc">
  <style>
    .marker { animation: breathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .m2 { animation-delay: .8s; } .m3 { animation-delay: 1.6s; } .m4 { animation-delay: 2.4s; }
    @keyframes breathe { 0%,100% { opacity: .4; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .marker { animation: none; } .motion { display: none; } }
  </style>
  <title id="title">Engineering goals</title>
  <desc id="desc">Professional goals: grow as an engineer, build useful products, contribute to open source, and design reliable systems.</desc>
  <rect x="1" y="1" width="1598" height="328" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="48" y="60" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Goals</text>
  <text x="1552" y="58" text-anchor="end" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="16">What I’m working toward</text>
  <line x1="48" y1="82" x2="1552" y2="82" stroke="#30363d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(48 112)">
      <text x="0" y="15" fill="#58a6ff" font-size="15" font-weight="700" letter-spacing="1.3">01</text>
      <circle cx="350" cy="10" r="4" fill="#58a6ff" class="marker motion"><animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>
      <text x="0" y="55" fill="#e6edf3" font-size="22" font-weight="700">Grow as an engineer</text>
      <text x="0" y="88" fill="#8b949e" font-size="17"><tspan x="0">Build strong fundamentals</tspan><tspan x="0" dy="25">and keep learning.</tspan></text>
    </g>
    <line x1="420" y1="112" x2="420" y2="282" stroke="#30363d"/>
    <g transform="translate(440 112)">
      <text x="0" y="15" fill="#39c5cf" font-size="15" font-weight="700" letter-spacing="1.3">02</text>
      <circle cx="350" cy="10" r="4" fill="#39c5cf" class="marker motion m2"><animate attributeName="r" values="3;6;3" dur="2.8s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin=".7s" repeatCount="indefinite"/></circle>
      <text x="0" y="55" fill="#e6edf3" font-size="22" font-weight="700">Build useful products</text>
      <text x="0" y="88" fill="#8b949e" font-size="17"><tspan x="0">Solve real problems with</tspan><tspan x="0" dy="25">thoughtful software.</tspan></text>
    </g>
    <line x1="812" y1="112" x2="812" y2="282" stroke="#30363d"/>
    <g transform="translate(832 112)">
      <text x="0" y="15" fill="#bc8cff" font-size="15" font-weight="700" letter-spacing="1.3">03</text>
      <circle cx="350" cy="10" r="4" fill="#bc8cff" class="marker motion m3"><animate attributeName="r" values="3;6;3" dur="2.8s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
      <text x="0" y="55" fill="#e6edf3" font-size="22" font-weight="700">Contribute to open source</text>
      <text x="0" y="88" fill="#8b949e" font-size="17"><tspan x="0">Learn with the community</tspan><tspan x="0" dy="25">and share useful work.</tspan></text>
    </g>
    <line x1="1204" y1="112" x2="1204" y2="282" stroke="#30363d"/>
    <g transform="translate(1224 112)">
      <text x="0" y="15" fill="#3fb950" font-size="15" font-weight="700" letter-spacing="1.3">04</text>
      <circle cx="350" cy="10" r="4" fill="#3fb950" class="marker motion m4"><animate attributeName="r" values="3;6;3" dur="2.8s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
      <text x="0" y="55" fill="#e6edf3" font-size="22" font-weight="700">Design reliable systems</text>
      <text x="0" y="88" fill="#8b949e" font-size="17"><tspan x="0">Focus on quality, scale,</tspan><tspan x="0" dy="25">and maintainability.</tspan></text>
    </g>
  </g>
</svg>
