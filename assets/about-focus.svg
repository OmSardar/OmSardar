<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <style>
    .accent { animation: breathe 3.4s ease-in-out infinite; }
    .d2 { animation-delay: 1.2s; }
    .glint { animation: sweep 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes sweep { 0%,20% { transform: translateX(0); opacity: 0; } 45% { opacity: .65; } 80%,100% { transform: translateX(700px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .accent,.glint { animation: none; } }
  </style>
  <defs>
    <linearGradient id="movingGradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#58a6ff"/><stop offset=".24" stop-color="#39c5cf"/><stop offset=".5" stop-color="#bc8cff"/><stop offset=".76" stop-color="#ff7b9c"/><stop offset="1" stop-color="#58a6ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="16s" repeatCount="indefinite"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#1f6feb" stop-opacity=".18"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <title id="title">About Om Sardar and current focus</title>
  <desc id="desc">Background, education, interests, and hobbies alongside current learning priorities.</desc>
  <rect x="1" y="1" width="1598" height="648" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <circle cx="280" cy="180" r="340" fill="url(#aura)"/><circle cx="1380" cy="480" r="310" fill="url(#aura)" opacity=".55"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(30 30)">
      <rect width="755" height="590" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="755" height="6" rx="3" fill="#58a6ff" class="accent"/>
      <rect class="glint" x="0" y="2" width="70" height="3" fill="#fff" opacity="0"><animate attributeName="x" values="0;685" dur="5s" repeatCount="indefinite"/></rect>
      <text x="38" y="66" fill="url(#movingGradient)" filter="url(#glow)" font-size="32" font-weight="700">About Me</text>
      <text x="38" y="118" fill="#c9d1d9" font-size="22"><tspan x="38">Software engineer focused on Java backend development, Spring Boot,</tspan><tspan x="38" dy="32">microservices, and system design. I also build full-stack applications;</tspan><tspan x="38" dy="32">AuctionX began as my final-year BCA minor project.</tspan></text>
      <path d="M38 222H717" stroke="#30363d"/>
      <g fill="#8b949e" font-size="21">
        <circle cx="49" cy="270" r="5" fill="#39c5cf"/><text x="69" y="277"><tspan fill="#f0f6fc" font-weight="700">Education</tspan><tspan>  MCA — Kalyani Government Engineering College (KGEC),</tspan></text><text x="69" y="306">West Bengal</text>
        <circle cx="49" cy="348" r="5" fill="#bc8cff"/><text x="69" y="355"><tspan fill="#f0f6fc" font-weight="700">Location</tspan><tspan>  Kolkata, West Bengal, India</tspan></text>
        <circle cx="49" cy="397" r="5" fill="#ff7b9c"/><text x="69" y="404"><tspan fill="#f0f6fc" font-weight="700">Interests</tspan><tspan>  Backend Development, Distributed Systems, Cloud,</tspan></text><text x="69" y="433">AI/ML, Data Engineering</text>
        <circle cx="49" cy="475" r="5" fill="#58a6ff"/><text x="69" y="482"><tspan fill="#f0f6fc" font-weight="700">Hobbies</tspan><tspan>  Coffee, Painting, Blender, Exploring Tech</tspan></text>
      </g>
      <text x="38" y="550" fill="#8b949e" font-size="16" letter-spacing="1.6">ENGINEERING • CURIOSITY • CONTINUOUS LEARNING</text>
    </g>
    <g transform="translate(815 30)">
      <rect width="755" height="590" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="755" height="6" rx="3" fill="#bc8cff" class="accent d2"/>
      <text x="38" y="66" fill="url(#movingGradient)" filter="url(#glow)" font-size="32" font-weight="700">Current Focus</text>
      <text x="717" y="64" text-anchor="end" fill="#8b949e" font-size="17">Areas I’m actively developing</text>
      <g font-size="23" fill="#c9d1d9">
        <g transform="translate(38 132)"><circle cx="16" cy="0" r="16" fill="#1f6feb" opacity=".2"/><text x="16" y="7" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">01</text><text x="52" y="8">Strengthening DSA and System Design fundamentals</text></g>
        <g transform="translate(38 208)"><circle cx="16" cy="0" r="16" fill="#39c5cf" opacity=".18"/><text x="16" y="7" text-anchor="middle" fill="#39c5cf" font-size="16" font-weight="700">02</text><text x="52" y="8">Building real-world projects with Java and Spring Boot</text></g>
        <g transform="translate(38 284)"><circle cx="16" cy="0" r="16" fill="#bc8cff" opacity=".18"/><text x="16" y="7" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">03</text><text x="52" y="8">Exploring Cloud, AWS, DevOps and AI tools</text></g>
        <g transform="translate(38 360)"><circle cx="16" cy="0" r="16" fill="#ff7b9c" opacity=".18"/><text x="16" y="7" text-anchor="middle" fill="#ff7b9c" font-size="16" font-weight="700">04</text><text x="52" y="8">Learning Cyber Security and CI/CD pipelines</text></g>
        <g transform="translate(38 436)"><circle cx="16" cy="0" r="16" fill="#f0883e" opacity=".18"/><text x="16" y="7" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="700">05</text><text x="52" y="8">Deepening Advanced AI/ML Integration</text></g>
      </g>
      <path d="M38 500H717" stroke="#30363d"/><circle cx="54" cy="544" r="6" fill="#3fb950" class="accent"/><text x="74" y="551" fill="#8b949e" font-size="17">Learning by building, experimenting, and reflecting.</text>
    </g>
  </g>
</svg>
