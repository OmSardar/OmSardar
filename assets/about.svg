<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 380" role="img" aria-labelledby="title desc">
  <style>
    .accent { animation: fade 3.2s ease-in-out infinite; }
    .rule { stroke-dasharray: 10 18; animation: dash 12s linear infinite; }
    @keyframes fade { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -112; } }
    .motion { animation: none; }
    @media (prefers-reduced-motion: reduce) { .accent, .rule { animation: none; } .motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="movingGradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#58a6ff"/><stop offset=".24" stop-color="#39c5cf"/><stop offset=".5" stop-color="#bc8cff"/><stop offset=".76" stop-color="#ff7b9c"/><stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="auraBlue"><stop offset="0" stop-color="#1f6feb" stop-opacity=".22"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
    <radialGradient id="auraPink"><stop offset="0" stop-color="#d946ef" stop-opacity=".14"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></radialGradient>
    <filter id="textGlow" x="-35%" y="-70%" width="170%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="softGlow"/><feComponentTransfer in="softGlow" result="glow"><feFuncA type="linear" slope=".62"/></feComponentTransfer><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <title id="title">About Om Sardar</title>
  <desc id="desc">Software engineer focused on Java backend development, Spring Boot, microservices, system design, and full-stack applications.</desc>
  <rect x="1" y="1" width="1598" height="378" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/><circle cx="220" cy="95" r="280" fill="url(#auraBlue)"><animate attributeName="cx" values="220;500;220" dur="22s" repeatCount="indefinite"/></circle><circle cx="1380" cy="285" r="300" fill="url(#auraPink)"><animate attributeName="cx" values="1380;1100;1380" dur="26s" repeatCount="indefinite"/></circle>
  <rect x="1" y="1" width="8" height="378" rx="4" fill="#58a6ff" class="accent"/>
  <text x="64" y="64" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ABOUT ME</text>
  <text x="64" y="132" fill="url(#movingGradient)" filter="url(#textGlow)" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Om Sardar<animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" keyTimes="0;.5;1" dur="6s" begin="0s" repeatCount="indefinite"/></text>
  <text x="64" y="181" fill="url(#movingGradient)" filter="url(#textGlow)" font-family="Arial, Helvetica, sans-serif" font-size="25">Software Engineer · Java Backend · Full-Stack Development<animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" keyTimes="0;.5;1" dur="6s" begin="1s" repeatCount="indefinite"/></text>
  <line x1="64" y1="220" x2="1536" y2="220" stroke="#30363d"/>
  <line x1="64" y1="220" x2="1536" y2="220" stroke="#58a6ff" stroke-width="2" class="rule"/>
  <circle class="motion" cx="64" cy="220" r="4" fill="#39c5cf">
    <animateMotion path="M0 0H1472" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle class="motion" cx="1536" cy="220" r="3" fill="#bc8cff" opacity=".9">
    <animateMotion path="M0 0H-1472" dur="7s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <text x="64" y="267" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="19">Focused on Java, Spring Boot, microservices, and system design.</text>
  <text x="64" y="300" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="19">I also build full-stack applications; AuctionX began as my final-year BCA project.</text>
  <circle cx="67" cy="344" r="4" fill="#3fb950" class="accent"/>
  <text x="80" y="349" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing=".6">KOLKATA, INDIA</text>
  <text x="1536" y="348" text-anchor="end" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing=".8">JAVA  ·  SPRING BOOT  ·  SYSTEM DESIGN</text>
</svg>
