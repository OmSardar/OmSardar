<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 115" role="img" aria-labelledby="title desc">
  <style>.pulse{animation:pulse 3.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
  <defs><linearGradient id="movingGradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#58a6ff"/><stop offset=".24" stop-color="#39c5cf"/><stop offset=".5" stop-color="#bc8cff"/><stop offset=".76" stop-color="#ff7b9c"/><stop offset="1" stop-color="#58a6ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="16s" repeatCount="indefinite"/></linearGradient></defs>
  <title id="title">Build, learn, and grow together</title><desc id="desc">Let's build, learn, and grow together.</desc><g font-family="Arial, Helvetica, sans-serif" text-anchor="middle"><path d="M520 56h150M930 56h150" stroke="#30363d" stroke-width="2"/><circle cx="520" cy="56" r="4" fill="#39c5cf" class="pulse"/><circle cx="1080" cy="56" r="4" fill="#ff7b9c" class="pulse"/><text x="800" y="66" fill="url(#movingGradient)" font-size="24" font-weight="700">“Let’s build, learn, and grow together.”</text></g>
</svg>
