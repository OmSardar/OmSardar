<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <style>.accent{animation:breathe 3.5s ease-in-out infinite}.d2{animation-delay:1.2s}.glint{animation:sweep 5s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sweep{0%,20%{transform:translateX(0);opacity:0}45%{opacity:.6}80%,100%{transform:translateX(680px);opacity:0}}@media(prefers-reduced-motion:reduce){.accent,.glint{animation:none}}</style>
  <defs><linearGradient id="movingGradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#58a6ff"/><stop offset=".24" stop-color="#39c5cf"/><stop offset=".5" stop-color="#bc8cff"/><stop offset=".76" stop-color="#ff7b9c"/><stop offset="1" stop-color="#58a6ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="16s" repeatCount="indefinite"/></linearGradient><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <title id="title">Open to opportunities and collaboration</title><desc id="desc">Career opportunities include internships, software engineering, full-stack, and backend roles. Collaboration includes freelance projects, open source, technical writing, and project collaborations.</desc><rect x="1" y="1" width="1598" height="438" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(30 28)"><rect width="750" height="384" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="750" height="5" rx="3" fill="#58a6ff" class="accent"/><rect class="glint" width="70" height="3" y="1" fill="#fff" opacity="0"><animate attributeName="x" values="0;678" dur="5s" repeatCount="indefinite"/></rect><circle cx="48" cy="55" r="22" fill="#1f6feb" opacity=".22"/><path d="M39 58h18v14H39zM42 58v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="64" fill="url(#movingGradient)" filter="url(#glow)" font-size="27" font-weight="700">Career Opportunities</text><path d="M32 100H718" stroke="#30363d"/><g fill="#c9d1d9" font-size="22"><circle cx="48" cy="146" r="5" fill="#58a6ff"/><text x="72" y="153">Internships and entry-level opportunities</text><circle cx="48" cy="202" r="5" fill="#58a6ff"/><text x="72" y="209">Full-time software engineering roles</text><circle cx="48" cy="258" r="5" fill="#58a6ff"/><text x="72" y="265">Full-stack development positions</text><circle cx="48" cy="314" r="5" fill="#58a6ff"/><text x="72" y="321">Backend development roles</text></g></g>
    <g transform="translate(820 28)"><rect width="750" height="384" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="750" height="5" rx="3" fill="#ff7b9c" class="accent d2"/><rect class="glint" width="70" height="3" y="1" fill="#fff" opacity="0"><animate attributeName="x" values="0;678" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect><circle cx="48" cy="55" r="22" fill="#ff7b9c" opacity=".2"/><path d="M39 54c5-6 13-6 18 0M39 60c5 6 13 6 18 0M48 49v16" fill="none" stroke="#ff7b9c" stroke-width="3" stroke-linecap="round"/><text x="88" y="64" fill="url(#movingGradient)" filter="url(#glow)" font-size="27" font-weight="700">Collaboration</text><path d="M32 100H718" stroke="#30363d"/><g fill="#c9d1d9" font-size="22"><circle cx="48" cy="146" r="5" fill="#ff7b9c"/><text x="72" y="153">Freelance and technical projects</text><circle cx="48" cy="202" r="5" fill="#ff7b9c"/><text x="72" y="209">Open-source collaboration</text><circle cx="48" cy="258" r="5" fill="#ff7b9c"/><text x="72" y="265">Technical writing and knowledge sharing</text><circle cx="48" cy="314" r="5" fill="#ff7b9c"/><text x="72" y="321">Interesting project collaborations</text></g></g>
  </g>
</svg>
