  <style>.accent{animation:breathe 3.5s ease-in-out infinite}.d2{animation-delay:.8s}.d3{animation-delay:1.6s}.d4{animation-delay:2.4s}.glint{animation:sweep 5s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sweep{0%,20%{transform:translateX(0);opacity:0}45%{opacity:.6}80%,100%{transform:translateX(680px);opacity:0}}@media(prefers-reduced-motion:reduce){.accent,.glint{animation:none}}</style>
