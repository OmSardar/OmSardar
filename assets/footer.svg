<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 250" role="img" aria-labelledby="title desc">
  <style>.pulse{animation:pulse 3.6s ease-in-out infinite}.d2{animation-delay:.6s}.d3{animation-delay:1.2s}.d4{animation-delay:1.8s}.glint{animation:sweep 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.58}50%{opacity:1}}@keyframes sweep{0%,20%{transform:translateX(0);opacity:0}45%{opacity:.65}80%,100%{transform:translateX(1450px);opacity:0}}@media(prefers-reduced-motion:reduce){.pulse,.glint{animation:none}}</style>
  <defs><linearGradient id="movingGradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#58a6ff"/><stop offset=".24" stop-color="#39c5cf"/><stop offset=".5" stop-color="#bc8cff"/><stop offset=".76" stop-color="#ff7b9c"/><stop offset="1" stop-color="#58a6ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="16s" repeatCount="indefinite"/></linearGradient><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <title id="title">Engineering values</title><desc id="desc">Build with purpose, learn continuously, ship better. Code, learn, build, improve.</desc><rect x="2" y="2" width="1596" height="246" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="3" y="3" width="1594" height="4" rx="2" fill="url(#movingGradient)" class="pulse"/><rect x="4" y="4" width="48" height="2" rx="1" fill="#fff" class="glint"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle"><text x="800" y="86" fill="url(#movingGradient)" filter="url(#glow)" font-size="30" font-weight="700">Build with purpose. Learn continuously. Ship better.</text><path d="M300 126H1300" stroke="#30363d" stroke-width="2"/><g font-size="21" font-weight="700" letter-spacing="1.4"><text x="475" y="180" fill="#58a6ff" class="pulse">CODE</text><circle cx="575" cy="173" r="4" fill="#39c5cf" class="pulse d2"/><text x="675" y="180" fill="#39c5cf" class="pulse d2">LEARN</text><circle cx="800" cy="173" r="4" fill="#bc8cff" class="pulse d3"/><text x="900" y="180" fill="#bc8cff" class="pulse d3">BUILD</text><circle cx="1025" cy="173" r="4" fill="#ff7b9c" class="pulse d4"/><text x="1125" y="180" fill="#ff7b9c" class="pulse d4">IMPROVE</text></g><text x="800" y="220" fill="#8b949e" font-size="15" letter-spacing="2">A LITTLE BETTER WITH EVERY ITERATION</text></g>
</svg>
