<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 410" role="img" aria-labelledby="title desc">
  <style>.accent{animation:breathe 3.5s ease-in-out infinite}.d2{animation-delay:1s}.d3{animation-delay:2s}.glint{animation:sweep 5s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sweep{0%,20%{transform:translateX(0);opacity:0}45%{opacity:.6}80%,100%{transform:translateX(480px);opacity:0}}@media(prefers-reduced-motion:reduce){.accent,.glint{animation:none}}</style>
  <defs><linearGradient id="movingGradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#58a6ff"/><stop offset=".24" stop-color="#39c5cf"/><stop offset=".5" stop-color="#bc8cff"/><stop offset=".76" stop-color="#ff7b9c"/><stop offset="1" stop-color="#58a6ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="16s" repeatCount="indefinite"/></linearGradient><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <title id="title">Key Areas of Interest</title><desc id="desc">Focus areas across scalability and performance, security and reliability, and architecture and design.</desc>
  <rect x="1" y="1" width="1598" height="408" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(24 24)"><rect width="496" height="360" rx="15" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="496" height="5" rx="3" fill="#58a6ff" class="accent"/><rect class="glint" width="58" height="3" y="1" fill="#fff" opacity="0"><animate attributeName="x" values="0;438" dur="5s" repeatCount="indefinite"/></rect><circle cx="42" cy="52" r="19" fill="#1f6feb" opacity=".2"/><text x="42" y="59" text-anchor="middle" fill="#58a6ff" font-size="18" font-weight="700">01</text><text x="76" y="60" fill="url(#movingGradient)" filter="url(#glow)" font-size="25" font-weight="700">Scalability &amp; Performance</text><g fill="#c9d1d9" font-size="22"><circle cx="44" cy="122" r="4" fill="#58a6ff"/><text x="62" y="129">Horizontal scaling strategies</text><circle cx="44" cy="176" r="4" fill="#58a6ff"/><text x="62" y="183">Caching with Redis</text><circle cx="44" cy="230" r="4" fill="#58a6ff"/><text x="62" y="237">Database optimization</text><circle cx="44" cy="284" r="4" fill="#58a6ff"/><text x="62" y="291">Load balancing</text></g></g>
    <g transform="translate(552 24)"><rect width="496" height="360" rx="15" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="496" height="5" rx="3" fill="#39c5cf" class="accent d2"/><rect class="glint" width="58" height="3" y="1" fill="#fff" opacity="0"><animate attributeName="x" values="0;438" dur="5s" begin="1s" repeatCount="indefinite"/></rect><circle cx="42" cy="52" r="19" fill="#39c5cf" opacity=".2"/><text x="42" y="59" text-anchor="middle" fill="#39c5cf" font-size="18" font-weight="700">02</text><text x="76" y="60" fill="url(#movingGradient)" filter="url(#glow)" font-size="25" font-weight="700">Security &amp; Reliability</text><g fill="#c9d1d9" font-size="22"><circle cx="44" cy="122" r="4" fill="#39c5cf"/><text x="62" y="129">Authentication (JWT, OAuth)</text><circle cx="44" cy="176" r="4" fill="#39c5cf"/><text x="62" y="183">Input validation and sanitization</text><circle cx="44" cy="230" r="4" fill="#39c5cf"/><text x="62" y="237">Rate limiting and CSRF protection</text><circle cx="44" cy="284" r="4" fill="#39c5cf"/><text x="62" y="291">Error handling patterns</text></g></g>
    <g transform="translate(1080 24)"><rect width="496" height="360" rx="15" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="496" height="5" rx="3" fill="#bc8cff" class="accent d3"/><rect class="glint" width="58" height="3" y="1" fill="#fff" opacity="0"><animate attributeName="x" values="0;438" dur="5s" begin="2s" repeatCount="indefinite"/></rect><circle cx="42" cy="52" r="19" fill="#bc8cff" opacity=".2"/><text x="42" y="59" text-anchor="middle" fill="#bc8cff" font-size="18" font-weight="700">03</text><text x="76" y="60" fill="url(#movingGradient)" filter="url(#glow)" font-size="25" font-weight="700">Architecture &amp; Design</text><g fill="#c9d1d9" font-size="22"><circle cx="44" cy="122" r="4" fill="#bc8cff"/><text x="62" y="129">API design (REST)</text><circle cx="44" cy="176" r="4" fill="#bc8cff"/><text x="62" y="183">Distributed systems concepts</text><circle cx="44" cy="230" r="4" fill="#bc8cff"/><text x="62" y="237">Event-driven patterns</text><circle cx="44" cy="284" r="4" fill="#bc8cff"/><text x="62" y="291">CI/CD and observability</text></g></g>
  </g>
</svg>
