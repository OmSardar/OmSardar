<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <style>.accent{animation:breathe 3.5s ease-in-out infinite}.d2{animation-delay:1.3s}.glint{animation:sweep 5s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}@keyframes sweep{0%,20%{transform:translateX(0);opacity:0}45%{opacity:.6}80%,100%{transform:translateX(700px);opacity:0}}@media(prefers-reduced-motion:reduce){.accent,.glint{animation:none}}</style>
  <defs><linearGradient id="movingGradient" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#58a6ff"/><stop offset=".24" stop-color="#39c5cf"/><stop offset=".5" stop-color="#bc8cff"/><stop offset=".76" stop-color="#ff7b9c"/><stop offset="1" stop-color="#58a6ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;800 0" dur="16s" repeatCount="indefinite"/></linearGradient><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <title id="title">Development Principles</title><desc id="desc">Ten principles for solving, designing, building, securing, testing, and improving software.</desc><rect x="1" y="1" width="1598" height="398" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif"><g transform="translate(24 24)"><rect width="752" height="352" rx="15" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="752" height="5" rx="3" fill="#58a6ff" class="accent"/><rect class="glint" width="70" height="3" y="1" fill="#fff" opacity="0"><animate attributeName="x" values="0;680" dur="5s" repeatCount="indefinite"/></rect><text x="32" y="53" fill="url(#movingGradient)" filter="url(#glow)" font-size="25" font-weight="700">Think with intent</text><g font-size="22" fill="#c9d1d9"><g><circle cx="48" cy="103" r="17" fill="#1f6feb" opacity=".23"/><text x="48" y="110" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">01</text><text x="82" y="110">Understand the problem before writing code</text></g><g><circle cx="48" cy="153" r="17" fill="#1f6feb" opacity=".23"/><text x="48" y="160" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">02</text><text x="82" y="160">Design before implementation</text></g><g><circle cx="48" cy="203" r="17" fill="#1f6feb" opacity=".23"/><text x="48" y="210" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">03</text><text x="82" y="210">Write maintainable, readable code</text></g><g><circle cx="48" cy="253" r="17" fill="#1f6feb" opacity=".23"/><text x="48" y="260" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">04</text><text x="82" y="260">Validate edge cases and failures</text></g><g><circle cx="48" cy="303" r="17" fill="#1f6feb" opacity=".23"/><text x="48" y="310" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">05</text><text x="82" y="310">Secure the application at every layer</text></g></g></g>
  <g transform="translate(824 24)"><rect width="752" height="352" rx="15" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect width="752" height="5" rx="3" fill="#bc8cff" class="accent d2"/><rect class="glint" width="70" height="3" y="1" fill="#fff" opacity="0"><animate attributeName="x" values="0;680" dur="5s" begin="1.3s" repeatCount="indefinite"/></rect><text x="32" y="53" fill="url(#movingGradient)" filter="url(#glow)" font-size="25" font-weight="700">Improve with evidence</text><g font-size="22" fill="#c9d1d9"><g><circle cx="48" cy="103" r="17" fill="#bc8cff" opacity=".23"/><text x="48" y="110" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">06</text><text x="82" y="110">Test important paths thoroughly</text></g><g><circle cx="48" cy="153" r="17" fill="#bc8cff" opacity=".23"/><text x="48" y="160" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">07</text><text x="82" y="160">Measure before optimizing</text></g><g><circle cx="48" cy="203" r="17" fill="#bc8cff" opacity=".23"/><text x="48" y="210" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">08</text><text x="82" y="210">Document decisions and trade-offs</text></g><g><circle cx="48" cy="253" r="17" fill="#bc8cff" opacity=".23"/><text x="48" y="260" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">09</text><text x="82" y="260">Automate repetitive work</text></g><g><circle cx="48" cy="303" r="17" fill="#bc8cff" opacity=".23"/><text x="48" y="310" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">10</text><text x="82" y="310">Keep learning — always</text></g></g></g></g>
</svg>
