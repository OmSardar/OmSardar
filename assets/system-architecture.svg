<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc">
  <style>
    .flow { stroke-dasharray: 7 9; animation: flow 1.8s linear infinite; }
    .f2 { animation-duration: 2.2s; animation-delay: .25s; }
    .f3 { animation-duration: 2.6s; animation-delay: .5s; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .packet { animation: none; }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .packet { display: none; } }
  </style>
  <title id="title">Conceptual web application architecture</title>
  <desc id="desc">A conceptual diagram showing a browser client, edge routing, an API and application services, data stores, and cross-cutting security and observability concerns. This is a learning reference, not a deployed system.</desc>
  <rect x="1" y="1" width="1598" height="588" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="48" y="58" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Conceptual system architecture</text>
  <text x="48" y="88" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="16">A reference model for learning how web application components fit together</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(48 142)">
      <rect width="320" height="220" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="24" y="38" fill="#58a6ff" font-size="14" font-weight="700" letter-spacing="1.2">01 · CLIENT</text>
      <text x="24" y="86" fill="#e6edf3" font-size="23" font-weight="700">Browser</text>
      <text x="24" y="119" fill="#8b949e" font-size="17">Web interface</text>
      <line x1="24" y1="148" x2="296" y2="148" stroke="#30363d"/>
      <text x="24" y="180" fill="#c9d1d9" font-size="16">React · HTML · CSS</text>
    </g>
    <path d="M380 252H426" fill="none" stroke="#39c5cf" stroke-width="2" class="flow"/>
    <path d="M418 244l8 8-8 8" fill="none" stroke="#39c5cf" stroke-width="2"/>
    <circle class="packet" r="4" fill="#39c5cf"><animateMotion path="M380 252H426" dur="1.2s" repeatCount="indefinite"/></circle>
    <g transform="translate(440 142)">
      <rect width="320" height="220" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="24" y="38" fill="#39c5cf" font-size="14" font-weight="700" letter-spacing="1.2">02 · EDGE</text>
      <text x="24" y="86" fill="#e6edf3" font-size="23" font-weight="700">Routing &amp; TLS</text>
      <text x="24" y="119" fill="#8b949e" font-size="17">Entry point for requests</text>
      <line x1="24" y1="148" x2="296" y2="148" stroke="#30363d"/>
      <text x="24" y="180" fill="#c9d1d9" font-size="16">Proxy · Load balancing</text>
    </g>
    <path d="M772 252H818" fill="none" stroke="#bc8cff" stroke-width="2" class="flow f2"/>
    <path d="M810 244l8 8-8 8" fill="none" stroke="#bc8cff" stroke-width="2"/>
    <circle class="packet" r="4" fill="#bc8cff"><animateMotion path="M772 252H818" dur="1.6s" begin=".3s" repeatCount="indefinite"/></circle>
    <g transform="translate(832 142)">
      <rect width="320" height="220" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="24" y="38" fill="#bc8cff" font-size="14" font-weight="700" letter-spacing="1.2">03 · APPLICATION</text>
      <text x="24" y="86" fill="#e6edf3" font-size="23" font-weight="700">API &amp; services</text>
      <text x="24" y="119" fill="#8b949e" font-size="17">Validation · Business logic</text>
      <line x1="24" y1="148" x2="296" y2="148" stroke="#30363d"/>
      <text x="24" y="180" fill="#c9d1d9" font-size="16">Spring Boot · Node.js</text>
    </g>
    <path d="M1164 252H1210" fill="none" stroke="#3fb950" stroke-width="2" class="flow f3"/>
    <path d="M1202 244l8 8-8 8" fill="none" stroke="#3fb950" stroke-width="2"/>
    <circle class="packet" r="4" fill="#3fb950"><animateMotion path="M1164 252H1210" dur="1.4s" begin=".6s" repeatCount="indefinite"/></circle>
    <g transform="translate(1224 142)">
      <rect width="328" height="220" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="24" y="38" fill="#3fb950" font-size="14" font-weight="700" letter-spacing="1.2">04 · DATA</text>
      <text x="24" y="86" fill="#e6edf3" font-size="23" font-weight="700">Persistence</text>
      <text x="24" y="119" fill="#8b949e" font-size="17">Choose for the workload</text>
      <line x1="24" y1="148" x2="304" y2="148" stroke="#30363d"/>
      <text x="24" y="180" fill="#c9d1d9" font-size="16">PostgreSQL · MongoDB</text>
    </g>
  </g>
  <rect x="48" y="400" width="1504" height="98" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="76" y="438" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">CROSS-CUTTING CONCERNS</text>
  <text x="76" y="474" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="19">Authentication &amp; security</text>
  <circle cx="386" cy="468" r="3" fill="#39c5cf"/>
  <text x="410" y="474" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="19">Logging &amp; observability</text>
  <circle cx="738" cy="468" r="3" fill="#bc8cff"/>
  <text x="762" y="474" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="19">Testing &amp; reliability</text>
  <circle cx="1060" cy="468" r="3" fill="#3fb950"/>
  <text x="1084" y="474" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="19">Caching &amp; performance</text>
  <text x="1550" y="548" text-anchor="end" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="14">Conceptual learning diagram · Actual architectures vary by project</text>
</svg>
