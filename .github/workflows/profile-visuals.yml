name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: OmSardar
          # A user-scoped token lets the action read the account's full contribution calendar.
          # Add PROFILE_READ_TOKEN in repository Actions secrets; GITHUB_TOKEN is the fallback.
          github_token: ${{ secrets.PROFILE_READ_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230d1117&color_dots=%23ffffff,%23ffe6ef,%23ffb3cc,%23ff6699,%23e6005c
            dist/github-contribution-grid-snake-dark.svg?color_snake=%230d1117&color_dots=%23ffffff,%23ffe6ef,%23ffb3cc,%23ff6699,%23e6005c

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Snake SVGs
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
